{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{=site.url}">
      <img class="logo-light" src="{=site.url('images/logo.png')}" width="300" height="70" alt="Wattle Street Vet, Mount Eliza, est 1998">
      <img class="logo-dark" src="{=site.url('images/logo-dark.png')}" width="300" height="70" alt="" aria-hidden="true">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle"><span></span></label>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{=site.url}">Home</a></li>
        <li><a href="{=site.url('services')}">Our Services</a></li>
        <li><a href="{=site.url('contact')}">Contact Us</a></li>
      </ul>
    </nav>
  </div>
</header>
